<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favico/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favico/favicon.svg" />
    <link rel="shortcut icon" href="/favico/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favico/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="OceansOfNYC" />
    <link rel="manifest" href="/favico/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats - Oceans of NYC</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #ffffff;
            color: #333;
            padding-top: 60px;
        }

        /* Navigation */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }

        .nav-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .nav-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s, border-color 0.2s;
            border-bottom: 2px solid transparent;
        }

        .nav-link:hover {
            color: white;
        }

        .nav-link.active {
            color: white;
            border-bottom-color: white;
        }

        .nav-stats {
            display: flex;
            align-items: center;
            gap: 16px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 500;
            margin-left: 24px;
        }

        .nav-stats strong {
            color: white;
            font-weight: 600;
        }

        .nav-stats.mobile {
            display: none;
        }

        .filter-toggle {
            display: none;
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            color: white;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .filter-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 768px) {
            .nav {
                flex-wrap: wrap;
                height: auto;
                padding: 12px 16px;
            }

            .nav-brand {
                flex: 1;
            }

            .nav-title {
                font-size: 16px;
            }

            .nav-links {
                flex-basis: 100%;
                justify-content: flex-start;
                gap: 4px;
                margin-top: 12px;
                flex-wrap: wrap;
            }

            .nav-link {
                padding: 6px 12px;
                font-size: 13px;
            }

            .nav-stats {
                display: none;
            }

            .nav-stats.mobile {
                display: flex;
                flex-basis: 100%;
                margin: 8px 0 0 0;
                gap: 12px;
                font-size: 13px;
            }

            .filter-toggle {
                display: block;
            }

            body {
                padding-top: 110px;
            }
        }

        /* Stats page */
        .stats-page {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .stats-page h1 {
            font-size: 32px;
            margin-bottom: 32px;
            font-weight: 600;
        }

        .chart-section {
            margin-bottom: 48px;
        }

        .chart-section h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #333;
        }

        .chart-container {
            position: relative;
            height: 250px;
            background: transparent;
        }

        .chart-container.tall {
            height: 320px;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 768px) {
            .chart-container {
                height: 200px;
            }
            .chart-container.tall {
                height: 280px;
            }
        }
    </style>
    <script src="shared.js"></script>
</head>
<body>
    <!-- Header loaded via shared.js -->

    <main class="stats-page">
        
        <section class="chart-section">
            <h2>Sightings per Day</h2>
            <div class="chart-container">
                <canvas id="sightingsPerDayChart"></canvas>
            </div>
        </section>

        <section class="chart-section">
            <h2>Cumulative Sightings</h2>
            <div class="chart-container">
                <canvas id="cumulativeSightingsChart"></canvas>
            </div>
        </section>

        <section class="chart-section">
            <h2>Contributors</h2>
            <div class="chart-container">
                <canvas id="cumulativeContributorsChart"></canvas>
            </div>
        </section>

        <section class="chart-section">
            <h2>Top 10 Contributors All-time</h2>
            <div class="chart-container tall">
                <canvas id="topContributorsAllTimeChart"></canvas>
            </div>
        </section>

        <section class="chart-section">
            <h2>Top 10 Contributors last 14 days</h2>
            <div class="chart-container tall">
                <canvas id="topContributors14DaysChart"></canvas>
            </div>
        </section>
    </main>

    <script>
        const CHART_COLOR = '#6b9bd1';
        const TEXT_COLOR = 'rgba(0,0,0,0.7)';
        const CHART_DEFAULTS = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false }
            },
            scales: {
                x: {
                    grid: { display: false },
                    ticks: { color: TEXT_COLOR, font: { size: 11 } },
                    border: { color: 'rgba(0,0,0,0.1)' }
                },
                y: {
                    grid: { color: 'rgba(0,0,0,0.1)' },
                    ticks: { color: TEXT_COLOR, font: { size: 11 } },
                    border: { display: false }
                }
            }
        };

        async function loadData() {
            const response = await fetch('https://cdn.oceansofnyc.com/web/vehicles.json');
            const data = await response.json();
            return data.vehicles;
        }

        function extractSightings(vehicles) {
            const sightings = [];
            for (const v of vehicles) {
                if (v.sightings && v.sightings.length > 0) {
                    for (const s of v.sightings) {
                        sightings.push({
                            date: new Date(s.timestamp),
                            contributor: s.contributor || 'Unknown',
                            borough: s.borough,
                            vehicleId: v.vin,
                            isFirstSighting: s.isFirstSighting
                        });
                    }
                }
            }
            return sightings.sort((a, b) => a.date - b.date);
        }

        function formatDate(date) {
            return date.toLocaleDateString('en-US', {
                timeZone: 'America/New_York',
                month: 'short',
                day: 'numeric'
            });
        }

        // Get date string in ET timezone (YYYY-MM-DD format)
        function getETDateKey(date) {
            return date.toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
        }

        // Format a YYYY-MM-DD date key as "Mon Day" label
        function formatDateKey(dateKey) {
            // Parse with noon time to avoid timezone day-boundary issues
            return formatDate(new Date(dateKey + 'T12:00:00'));
        }

        function createSightingsPerDayChart(sightings) {
            const cutoff = new Date('2025-12-06');
            const newSightings = {};
            const duplicateSightings = {};

            // Sightings are already sorted by date
            // Use the pre-calculated isFirstSighting flag from the database
            for (const s of sightings) {
                if (s.date >= cutoff) {
                    const key = getETDateKey(s.date);
                    if (s.isFirstSighting) {
                        newSightings[key] = (newSightings[key] || 0) + 1;
                    } else {
                        duplicateSightings[key] = (duplicateSightings[key] || 0) + 1;
                    }
                }
            }

            const allDates = new Set([...Object.keys(newSightings), ...Object.keys(duplicateSightings)]);
            const sortedDates = Array.from(allDates).sort();

            // Convert to {x, y} format for time scale
            const newData = sortedDates.map(d => ({ x: new Date(d + 'T12:00:00'), y: newSightings[d] || 0 }));
            const duplicateData = sortedDates.map(d => ({ x: new Date(d + 'T12:00:00'), y: duplicateSightings[d] || 0 }));

            new Chart(document.getElementById('sightingsPerDayChart'), {
                type: 'bar',
                data: {
                    datasets: [
                        {
                            label: 'First Sightings',
                            data: newData,
                            backgroundColor: '#e07b53',
                            borderRadius: { topLeft: 0, topRight: 0, bottomLeft: 2, bottomRight: 2 }
                        },
                        {
                            label: 'Duplicate Sightings',
                            data: duplicateData,
                            backgroundColor: CHART_COLOR,
                            borderRadius: { topLeft: 2, topRight: 2, bottomLeft: 0, bottomRight: 0 }
                        }
                    ]
                },
                options: {
                    ...CHART_DEFAULTS,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: { color: TEXT_COLOR, usePointStyle: true, pointStyle: 'rect' }
                        }
                    },
                    scales: {
                        ...CHART_DEFAULTS.scales,
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day',
                                displayFormats: { day: 'MMM d' },
                                tooltipFormat: 'MMM d, yyyy'
                            },
                            min: '2025-12-06',
                            stacked: true,
                            grid: { display: false },
                            ticks: { color: TEXT_COLOR, font: { size: 11 } },
                            border: { color: 'rgba(0,0,0,0.1)' },
                            title: { display: true, text: 'Date', color: TEXT_COLOR, align: 'end' }
                        },
                        y: {
                            ...CHART_DEFAULTS.scales.y,
                            stacked: true,
                            title: { display: true, text: 'Sightings', color: TEXT_COLOR }
                        }
                    }
                }
            });
        }

        function createCumulativeSightingsChart(sightings, totalVehicles) {
            const cutoff = new Date('2025-12-06');
            // Track daily sightings count and new unique vehicles
            // Use pre-calculated isFirstSighting flag from the database
            const dailySightings = {};
            const dailyNewVehicles = {};

            for (const s of sightings) {
                if (s.date >= cutoff) {
                    const key = getETDateKey(s.date);
                    dailySightings[key] = (dailySightings[key] || 0) + 1;

                    // Count only first sightings as new vehicles
                    if (s.isFirstSighting) {
                        dailyNewVehicles[key] = (dailyNewVehicles[key] || 0) + 1;
                    }
                }
            }

            // Get all dates from both datasets
            const allDates = new Set([...Object.keys(dailySightings), ...Object.keys(dailyNewVehicles)]);
            const sortedDates = Array.from(allDates).sort();

            // Build cumulative arrays with {x, y} format
            let cumulativeSightings = 0;
            let cumulativeUnique = 0;
            const cumulativeSightingsData = [];
            const cumulativeUniqueData = [];

            for (const d of sortedDates) {
                cumulativeSightings += dailySightings[d] || 0;
                cumulativeUnique += dailyNewVehicles[d] || 0;
                const date = new Date(d + 'T12:00:00');
                cumulativeSightingsData.push({ x: date, y: cumulativeSightings });
                cumulativeUniqueData.push({ x: date, y: cumulativeUnique });
            }

            const maxCount = Math.max(...cumulativeSightingsData.map(d => d.y));
            const maxPercent = (maxCount / totalVehicles) * 100;

            new Chart(document.getElementById('cumulativeSightingsChart'), {
                type: 'line',
                data: {
                    datasets: [
                        {
                            label: 'Total Sightings',
                            data: cumulativeSightingsData,
                            borderColor: CHART_COLOR,
                            backgroundColor: 'transparent',
                            tension: 0.1,
                            pointRadius: 0,
                            yAxisID: 'y'
                        },
                        {
                            label: 'Unique Oceans',
                            data: cumulativeUniqueData,
                            borderColor: '#e07b53',
                            backgroundColor: 'transparent',
                            tension: 0.1,
                            pointRadius: 0,
                            yAxisID: 'y'
                        }
                    ]
                },
                options: {
                    ...CHART_DEFAULTS,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: { color: TEXT_COLOR, usePointStyle: true, pointStyle: 'line' }
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day',
                                displayFormats: { day: 'MMM d' },
                                tooltipFormat: 'MMM d, yyyy'
                            },
                            min: '2025-12-06',
                            grid: { display: false },
                            ticks: { color: TEXT_COLOR, font: { size: 11 } },
                            border: { color: 'rgba(0,0,0,0.1)' },
                            title: { display: true, text: 'Date', color: TEXT_COLOR, align: 'end' }
                        },
                        y: {
                            ...CHART_DEFAULTS.scales.y,
                            position: 'left',
                            title: { display: true, text: 'Count', color: TEXT_COLOR }
                        },
                        y1: {
                            ...CHART_DEFAULTS.scales.y,
                            position: 'right',
                            min: 0,
                            max: maxPercent,
                            title: { display: true, text: `% of ${totalVehicles.toLocaleString()} Oceans`, color: TEXT_COLOR },
                            ticks: {
                                color: TEXT_COLOR,
                                font: { size: 11 },
                                callback: value => value.toFixed(1) + '%'
                            },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        function createCumulativeContributorsChart(sightings) {
            const cutoff = new Date('2025-12-06');
            const firstContribution = {};
            for (const s of sightings) {
                if (s.date >= cutoff) {
                    const key = getETDateKey(s.date);
                    if (!firstContribution[s.contributor] || key < firstContribution[s.contributor]) {
                        firstContribution[s.contributor] = key;
                    }
                }
            }

            const dateNewContributors = {};
            for (const [contributor, date] of Object.entries(firstContribution)) {
                if (date >= '2025-12-06') {
                    dateNewContributors[date] = (dateNewContributors[date] || 0) + 1;
                }
            }

            const sortedDates = Object.keys(dateNewContributors).sort();
            let cumulative = 0;
            const cumulativeData = [];
            for (const d of sortedDates) {
                cumulative += dateNewContributors[d];
                cumulativeData.push({ x: new Date(d + 'T12:00:00'), y: cumulative });
            }

            const maxValue = Math.max(...cumulativeData.map(d => d.y));

            new Chart(document.getElementById('cumulativeContributorsChart'), {
                type: 'line',
                data: {
                    datasets: [{
                        data: cumulativeData,
                        borderColor: CHART_COLOR,
                        backgroundColor: 'transparent',
                        stepped: true,
                        pointRadius: 0
                    }]
                },
                options: {
                    ...CHART_DEFAULTS,
                    scales: {
                        ...CHART_DEFAULTS.scales,
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day',
                                displayFormats: { day: 'MMM d' },
                                tooltipFormat: 'MMM d, yyyy'
                            },
                            min: '2025-12-06',
                            grid: { display: false },
                            ticks: { color: TEXT_COLOR, font: { size: 11 } },
                            border: { color: 'rgba(0,0,0,0.1)' },
                            title: { display: true, text: 'Date', color: TEXT_COLOR, align: 'end' }
                        },
                        y: {
                            ...CHART_DEFAULTS.scales.y,
                            title: { display: true, text: `Cumulative Contributors`, color: TEXT_COLOR }
                        }
                    }
                }
            });
        }

        function createTopContributorsChart(sightings, canvasId, title, filterFn = null) {
            let filtered = filterFn ? sightings.filter(filterFn) : sightings;

            const firstCounts = {};
            const duplicateCounts = {};
            for (const s of filtered) {
                if (s.isFirstSighting) {
                    firstCounts[s.contributor] = (firstCounts[s.contributor] || 0) + 1;
                } else {
                    duplicateCounts[s.contributor] = (duplicateCounts[s.contributor] || 0) + 1;
                }
            }

            // Get all unique contributors and calculate total counts
            const allContributors = new Set([...Object.keys(firstCounts), ...Object.keys(duplicateCounts)]);
            const contributorsWithTotals = Array.from(allContributors).map(name => ({
                name,
                first: firstCounts[name] || 0,
                duplicate: duplicateCounts[name] || 0,
                total: (firstCounts[name] || 0) + (duplicateCounts[name] || 0)
            }));

            // Sort by total and take top 10
            const sorted = contributorsWithTotals
                .sort((a, b) => b.total - a.total)
                .slice(0, 10);

            const labels = sorted.map(c => c.name);
            const firstValues = sorted.map(c => c.first);
            const duplicateValues = sorted.map(c => c.duplicate);

            new Chart(document.getElementById(canvasId), {
                type: 'bar',
                data: {
                    labels,
                    datasets: [
                        {
                            label: 'First Sightings',
                            data: firstValues,
                            backgroundColor: '#e07b53',
                            borderRadius: 2
                        },
                        {
                            label: 'Duplicate Sightings',
                            data: duplicateValues,
                            backgroundColor: CHART_COLOR,
                            borderRadius: 2
                        }
                    ]
                },
                options: {
                    ...CHART_DEFAULTS,
                    indexAxis: 'y',
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: { color: TEXT_COLOR, usePointStyle: true, pointStyle: 'rect' }
                        }
                    },
                    scales: {
                        x: {
                            ...CHART_DEFAULTS.scales.x,
                            stacked: true,
                            title: { display: true, text: 'Sightings Count', color: TEXT_COLOR, align: 'end' }
                        },
                        y: {
                            ...CHART_DEFAULTS.scales.y,
                            stacked: true,
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        async function init() {
            const vehicles = await loadData();
            const sightings = extractSightings(vehicles);
            const totalVehicles = vehicles.length;

            createSightingsPerDayChart(sightings);
            createCumulativeSightingsChart(sightings, totalVehicles);
            createCumulativeContributorsChart(sightings);
            createTopContributorsChart(sightings, 'topContributorsAllTimeChart', 'Top 10 Contributors All-time');

            const now = new Date();
            const fourteenDaysAgo = new Date(now.getTime() - 14 * 24 * 60 * 60 * 1000);
            createTopContributorsChart(
                sightings,
                'topContributors14DaysChart',
                'Top 10 Contributors last 14 days',
                s => s.date >= fourteenDaysAgo
            );
        }

        init();
    </script>
</body>
</html>
