<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favico/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favico/favicon.svg" />
    <link rel="shortcut icon" href="/favico/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favico/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="OceansOfNYC" />
    <link rel="manifest" href="/favico/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats - Oceans of NYC</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #ffffff;
            color: #333;
            padding-top: 60px;
        }

        /* Navigation */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }

        .nav-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .nav-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s, border-color 0.2s;
            border-bottom: 2px solid transparent;
        }

        .nav-link:hover {
            color: white;
        }

        .nav-link.active {
            color: white;
            border-bottom-color: white;
        }

        @media (max-width: 768px) {
            .nav {
                flex-wrap: wrap;
                height: auto;
                padding: 12px 16px;
            }

            .nav-brand {
                flex: 1;
            }

            .nav-title {
                font-size: 16px;
            }

            .nav-links {
                flex-basis: 100%;
                justify-content: flex-start;
                gap: 4px;
                margin-top: 12px;
                flex-wrap: wrap;
            }

            .nav-link {
                padding: 6px 12px;
                font-size: 13px;
            }

            body {
                padding-top: 110px;
            }
        }

        /* Stats page */
        .stats-page {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .stats-page h1 {
            font-size: 32px;
            margin-bottom: 32px;
            font-weight: 600;
        }

        .chart-section {
            margin-bottom: 48px;
        }

        .chart-section h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #333;
        }

        .chart-container {
            position: relative;
            height: 250px;
            background: transparent;
        }

        .chart-container.tall {
            height: 320px;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 768px) {
            .chart-container {
                height: 200px;
            }
            .chart-container.tall {
                height: 280px;
            }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="index.html" class="nav-brand">
            <img src="oceans_of_nyc_logo.png" alt="Logo" class="nav-logo">
            <span class="nav-title">Oceans of NYC</span>
        </a>
        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="badges.html" class="nav-link">Bumper Stickers</a>
            <a href="submit.html" class="nav-link">Submit</a>
            <a href="about.html" class="nav-link">About</a>
            <a href="stats.html" class="nav-link active">Stats</a>
        </div>
    </nav>

    <main class="stats-page">
        
        <section class="chart-section">
            <h2>Sightings per Day</h2>
            <div class="chart-container">
                <canvas id="sightingsPerDayChart"></canvas>
            </div>
        </section>

        <section class="chart-section">
            <h2>Cumulative Sightings</h2>
            <div class="chart-container">
                <canvas id="cumulativeSightingsChart"></canvas>
            </div>
        </section>

        <section class="chart-section">
            <h2>Contributors</h2>
            <div class="chart-container">
                <canvas id="cumulativeContributorsChart"></canvas>
            </div>
        </section>

        <section class="chart-section">
            <h2>Top 10 Contributors All-time</h2>
            <div class="chart-container tall">
                <canvas id="topContributorsAllTimeChart"></canvas>
            </div>
        </section>

        <section class="chart-section">
            <h2>Top 10 Contributors last 14 days</h2>
            <div class="chart-container tall">
                <canvas id="topContributors14DaysChart"></canvas>
            </div>
        </section>
    </main>

    <script>
        const CHART_COLOR = '#6b9bd1';
        const TEXT_COLOR = 'rgba(0,0,0,0.7)';
        const CHART_DEFAULTS = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false }
            },
            scales: {
                x: {
                    grid: { display: false },
                    ticks: { color: TEXT_COLOR, font: { size: 11 } },
                    border: { color: 'rgba(0,0,0,0.1)' }
                },
                y: {
                    grid: { color: 'rgba(0,0,0,0.1)' },
                    ticks: { color: TEXT_COLOR, font: { size: 11 } },
                    border: { display: false }
                }
            }
        };

        async function loadData() {
            const response = await fetch('https://cdn.oceansofnyc.com/web/vehicles.json');
            const data = await response.json();
            return data.vehicles;
        }

        function extractSightings(vehicles) {
            const sightings = [];
            for (const v of vehicles) {
                if (v.sightings && v.sightings.length > 0) {
                    for (const s of v.sightings) {
                        sightings.push({
                            date: new Date(s.timestamp),
                            contributor: s.contributor || 'Unknown',
                            borough: s.borough,
                            vehicleId: v.plate || v.id
                        });
                    }
                }
            }
            return sightings.sort((a, b) => a.date - b.date);
        }

        function formatDate(date) {
            return date.toLocaleDateString('en-US', {
                timeZone: 'America/New_York',
                month: 'short',
                day: 'numeric'
            });
        }

        // Get date string in ET timezone (YYYY-MM-DD format)
        function getETDateKey(date) {
            return date.toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
        }

        // Format a YYYY-MM-DD date key as "Mon Day" label
        function formatDateKey(dateKey) {
            // Parse with noon time to avoid timezone day-boundary issues
            return formatDate(new Date(dateKey + 'T12:00:00'));
        }

        function createSightingsPerDayChart(sightings) {
            const cutoff = new Date('2025-12-06');
            const seenVehicles = new Set();
            const newSightings = {};
            const duplicateSightings = {};

            // Sightings are already sorted by date
            for (const s of sightings) {
                if (s.date >= cutoff) {
                    const key = getETDateKey(s.date);
                    if (seenVehicles.has(s.vehicleId)) {
                        duplicateSightings[key] = (duplicateSightings[key] || 0) + 1;
                    } else {
                        seenVehicles.add(s.vehicleId);
                        newSightings[key] = (newSightings[key] || 0) + 1;
                    }
                }
            }

            const allDates = new Set([...Object.keys(newSightings), ...Object.keys(duplicateSightings)]);
            const sortedDates = Array.from(allDates).sort();
            const labels = sortedDates.map(d => formatDateKey(d));
            const newValues = sortedDates.map(d => newSightings[d] || 0);
            const duplicateValues = sortedDates.map(d => duplicateSightings[d] || 0);

            new Chart(document.getElementById('sightingsPerDayChart'), {
                type: 'bar',
                data: {
                    labels,
                    datasets: [
                        {
                            label: 'New Vehicles',
                            data: newValues,
                            backgroundColor: '#e07b53',
                            borderRadius: { topLeft: 0, topRight: 0, bottomLeft: 2, bottomRight: 2 }
                        },
                        {
                            label: 'Duplicate Sightings',
                            data: duplicateValues,
                            backgroundColor: CHART_COLOR,
                            borderRadius: { topLeft: 2, topRight: 2, bottomLeft: 0, bottomRight: 0 }
                        }
                    ]
                },
                options: {
                    ...CHART_DEFAULTS,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: { color: TEXT_COLOR, usePointStyle: true, pointStyle: 'rect' }
                        }
                    },
                    scales: {
                        ...CHART_DEFAULTS.scales,
                        x: {
                            ...CHART_DEFAULTS.scales.x,
                            stacked: true,
                            title: { display: true, text: 'Date', color: TEXT_COLOR, align: 'end' }
                        },
                        y: {
                            ...CHART_DEFAULTS.scales.y,
                            stacked: true,
                            title: { display: true, text: 'Sightings', color: TEXT_COLOR }
                        }
                    }
                }
            });
        }

        function createCumulativeSightingsChart(sightings, totalVehicles) {
            // Track daily sightings count and first sighting of each unique vehicle
            const dailySightings = {};
            const firstSightingDate = {}; // vehicleId -> date key of first sighting

            for (const s of sightings) {
                const key = getETDateKey(s.date);
                dailySightings[key] = (dailySightings[key] || 0) + 1;

                // Track first sighting date for each vehicle
                if (!firstSightingDate[s.vehicleId] || key < firstSightingDate[s.vehicleId]) {
                    firstSightingDate[s.vehicleId] = key;
                }
            }

            // Count new unique vehicles per day
            const dailyNewVehicles = {};
            for (const [vehicleId, dateKey] of Object.entries(firstSightingDate)) {
                dailyNewVehicles[dateKey] = (dailyNewVehicles[dateKey] || 0) + 1;
            }

            // Get all dates from both datasets
            const allDates = new Set([...Object.keys(dailySightings), ...Object.keys(dailyNewVehicles)]);
            const sortedDates = Array.from(allDates).sort();

            // Build cumulative arrays
            let cumulativeSightings = 0;
            let cumulativeUnique = 0;
            const cumulativeSightingsValues = [];
            const cumulativeUniqueValues = [];

            for (const d of sortedDates) {
                cumulativeSightings += dailySightings[d] || 0;
                cumulativeUnique += dailyNewVehicles[d] || 0;
                cumulativeSightingsValues.push(cumulativeSightings);
                cumulativeUniqueValues.push(cumulativeUnique);
            }

            const labels = sortedDates.map(d => formatDateKey(d));
            const maxCount = Math.max(...cumulativeSightingsValues);
            const maxPercent = (maxCount / totalVehicles) * 100;

            new Chart(document.getElementById('cumulativeSightingsChart'), {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        {
                            label: 'Total Sightings',
                            data: cumulativeSightingsValues,
                            borderColor: CHART_COLOR,
                            backgroundColor: 'transparent',
                            tension: 0.1,
                            pointRadius: 0,
                            yAxisID: 'y'
                        },
                        {
                            label: 'Unique Vehicles',
                            data: cumulativeUniqueValues,
                            borderColor: '#e07b53',
                            backgroundColor: 'transparent',
                            tension: 0.1,
                            pointRadius: 0,
                            yAxisID: 'y'
                        }
                    ]
                },
                options: {
                    ...CHART_DEFAULTS,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: { color: TEXT_COLOR, usePointStyle: true, pointStyle: 'line' }
                        }
                    },
                    scales: {
                        x: {
                            ...CHART_DEFAULTS.scales.x,
                            title: { display: true, text: 'Date', color: TEXT_COLOR, align: 'end' }
                        },
                        y: {
                            ...CHART_DEFAULTS.scales.y,
                            position: 'left',
                            title: { display: true, text: 'Count', color: TEXT_COLOR }
                        },
                        y1: {
                            ...CHART_DEFAULTS.scales.y,
                            position: 'right',
                            min: 0,
                            max: maxPercent,
                            title: { display: true, text: `% of ${totalVehicles.toLocaleString()} Vehicles`, color: TEXT_COLOR },
                            ticks: {
                                color: TEXT_COLOR,
                                font: { size: 11 },
                                callback: value => value.toFixed(1) + '%'
                            },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        function createCumulativeContributorsChart(sightings) {
            const firstContribution = {};
            for (const s of sightings) {
                const key = getETDateKey(s.date);
                if (!firstContribution[s.contributor] || key < firstContribution[s.contributor]) {
                    firstContribution[s.contributor] = key;
                }
            }

            const dateNewContributors = {};
            for (const [contributor, date] of Object.entries(firstContribution)) {
                dateNewContributors[date] = (dateNewContributors[date] || 0) + 1;
            }

            const sortedDates = Object.keys(dateNewContributors).sort();
            let cumulative = 0;
            const cumulativeValues = [];
            for (const d of sortedDates) {
                cumulative += dateNewContributors[d];
                cumulativeValues.push(cumulative);
            }

            const labels = sortedDates.map(d => formatDateKey(d));
            const maxValue = Math.max(...cumulativeValues);

            new Chart(document.getElementById('cumulativeContributorsChart'), {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        data: cumulativeValues,
                        borderColor: CHART_COLOR,
                        backgroundColor: 'transparent',
                        tension: 0.1,
                        pointRadius: 0
                    }]
                },
                options: {
                    ...CHART_DEFAULTS,
                    scales: {
                        ...CHART_DEFAULTS.scales,
                        y: {
                            ...CHART_DEFAULTS.scales.y,
                            title: { display: true, text: `${maxValue} Cumulative Contributors`, color: TEXT_COLOR }
                        },
                        x: {
                            ...CHART_DEFAULTS.scales.x,
                            title: { display: true, text: 'Date', color: TEXT_COLOR, align: 'end' }
                        }
                    }
                }
            });
        }

        function createTopContributorsChart(sightings, canvasId, title, filterFn = null) {
            let filtered = filterFn ? sightings.filter(filterFn) : sightings;

            const counts = {};
            for (const s of filtered) {
                counts[s.contributor] = (counts[s.contributor] || 0) + 1;
            }

            const sorted = Object.entries(counts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);

            const labels = sorted.map(([name]) => name);
            const values = sorted.map(([, count]) => count);

            new Chart(document.getElementById(canvasId), {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        data: values,
                        backgroundColor: CHART_COLOR,
                        borderRadius: 2
                    }]
                },
                options: {
                    ...CHART_DEFAULTS,
                    indexAxis: 'y',
                    scales: {
                        x: {
                            ...CHART_DEFAULTS.scales.x,
                            title: { display: true, text: 'Sightings Count', color: TEXT_COLOR, align: 'end' }
                        },
                        y: {
                            ...CHART_DEFAULTS.scales.y,
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        async function init() {
            const vehicles = await loadData();
            const sightings = extractSightings(vehicles);
            const totalVehicles = vehicles.length;

            createSightingsPerDayChart(sightings);
            createCumulativeSightingsChart(sightings, totalVehicles);
            createCumulativeContributorsChart(sightings);
            createTopContributorsChart(sightings, 'topContributorsAllTimeChart', 'Top 10 Contributors All-time');

            const now = new Date();
            const fourteenDaysAgo = new Date(now.getTime() - 14 * 24 * 60 * 60 * 1000);
            createTopContributorsChart(
                sightings,
                'topContributors14DaysChart',
                'Top 10 Contributors last 14 days',
                s => s.date >= fourteenDaysAgo
            );
        }

        init();
    </script>
</body>
</html>
