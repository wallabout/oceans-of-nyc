<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favico/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favico/favicon.svg" />
    <link rel="shortcut icon" href="/favico/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favico/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="OceansOfNYC" />
    <link rel="manifest" href="/favico/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bumper Stickers - Oceans of NYC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            padding-top: 60px;
        }

        /* Navigation */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }

        .nav-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .nav-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s, border-color 0.2s;
            border-bottom: 2px solid transparent;
        }

        .nav-link:hover {
            color: white;
        }

        .nav-link.active {
            color: white;
            border-bottom-color: white;
        }

        .bluesky-link {
            display: flex;
            align-items: center;
            border-bottom: none;
        }

        .nav-stats {
            display: flex;
            align-items: center;
            gap: 16px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 500;
            margin-left: 24px;
        }

        .nav-stats strong {
            color: white;
            font-weight: 600;
        }

        .nav-stats.mobile {
            display: none;
        }

        .filter-toggle {
            display: none;
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            color: white;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .filter-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 768px) {
            .nav {
                flex-wrap: wrap;
                height: auto;
                padding: 12px 16px;
            }

            .nav-brand {
                flex: 1;
            }

            .nav-title {
                font-size: 16px;
            }

            .nav-links {
                flex-basis: 100%;
                justify-content: flex-start;
                gap: 4px;
                margin-top: 12px;
                flex-wrap: wrap;
            }

            .nav-link {
                padding: 6px 12px;
                font-size: 13px;
            }

            .nav-stats {
                display: none;
            }

            .nav-stats.mobile {
                display: flex;
                flex-basis: 100%;
                margin: 8px 0 0 0;
                gap: 12px;
                font-size: 13px;
            }

            .filter-toggle {
                display: block;
            }

            body {
                padding-top: 110px;
            }
        }

        .container {
            max-width: 100%;
            padding: 20px;
        }

        .page-header {
            margin-bottom: 10px;
        }

        .page-header h1 {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .page-header p {
            font-size: 14px;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 16px;
        }

        .table-wrapper {
            overflow: auto;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            max-height: calc(100vh - 200px);
        }

        .badges-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 600px;
        }

        .badges-table th,
        .badges-table td {
            padding: 12px 16px;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
        }

        .badges-table th {
            background: #f5f5f5;
            font-weight: 600;
        }

        .badges-table thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .badges-table thead tr:first-child th {
            border-bottom: 1px solid #e0e0e0;
        }

        .badges-table thead tr:last-child th {
            border-bottom: 2px solid #e0e0e0;
        }

        /* First column (badge name) styling */
        .badges-table th:first-child,
        .badges-table td:first-child {
            text-align: left;
            position: sticky;
            left: 0;
            background: #ffffff;
            z-index: 5;
            min-width: 200px;
            border-right: 1px solid #e0e0e0;
        }

        .badges-table thead th:first-child,
        .badges-table .sighting-count-row th:first-child {
            background: #f5f5f5;
            z-index: 15;
        }

        .badges-table .sighting-count-row td:first-child {
            background: #f5f5f5;
        }

        .badges-table tr:hover td {
            background: #f9f9f9;
        }

        .badges-table tr:hover td:first-child {
            background: #f9f9f9;
        }

        .badge-cell {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-emoji {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        .badge-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .badge-name {
            font-weight: 600;
            color: #333;
        }

        .badge-description {
            font-size: 12px;
            color: #888;
        }

        .contributor-header {
            height: 140px;
            vertical-align: bottom;
            padding: 8px 4px !important;
        }

        .contributor-name {
            font-weight: 600;
            white-space: nowrap;
            writing-mode: vertical-lr;
            transform: rotate(180deg);
            display: inline-block;
        }

        .sighting-count-row th {
            background: #f5f5f5;
            font-weight: normal;
            font-size: 13px;
            color: #666;
        }

        .sighting-count-row td {
            background: #f5f5f5;
            font-weight: 600;
            color: #333;
        }

        .has-badge {
            color: #22c55e;
            font-size: 20px;
            text-decoration: none;
        }

        a.has-badge:hover {
            text-decoration: underline;
        }

        .no-badge {
            color: #e0e0e0;
            font-size: 16px;
        }

        .stats-row {
            display: flex;
            gap: 24px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: #f5f5f5;
            padding: 16px 24px;
            border-radius: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: #333;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        /* Category separator rows */
        .category-row td {
            background: #f0f0f0;
            font-weight: 600;
            text-align: left !important;
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 8px 16px;
        }

        .category-row td:first-child {
            background: #f0f0f0;
        }
    </style>
    <script src="shared.js"></script>
</head>
<body>
    <!-- Header loaded via shared.js -->

    <div class="container">
        <div class="page-header">
            <h1>Bumper Stickers</h1>
            <p>Badges earned by Oceans of NYC contributors</p>
        </div>

        <div class="loading" id="loading">Loading badge data...</div>

        <div id="content" style="display: none;">
            <!-- <div class="stats-row" id="stats"></div> -->
            <div class="table-wrapper">
                <table class="badges-table" id="badgesTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Badge categories for grouping
        const BADGE_CATEGORIES = {
            'ocean_spotter': 'Count-Based',
            '5_club': 'Count-Based',
            '10_club': 'Count-Based',
            '25_club': 'Count-Based',
            '50_club': 'Count-Based',
            '100_club': 'Count-Based',
            'sightings_benjamin': 'Count-Based',
            'oceans_century': 'Count-Based',
            'busy_week': 'Time-Based',
            'busy_month': 'Time-Based',
            'ocean_month': 'Time-Based',
            'ocean_quarter': 'Time-Based',
            'brooklyn': 'Location-Based',
            'manhattan': 'Location-Based',
            'queens': 'Location-Based',
            'bronx': 'Location-Based',
            'staten_island': 'Location-Based',
            '5_boro': 'Location-Based',
            'road_tripper': 'Location-Based',
            't5_club': 'Vehicle-Based',
            't8_club': 'Vehicle-Based',
            't_series': 'Vehicle-Based',
            'self_dupe': 'Sequence-Based',
            'seconds': 'Sequence-Based',
            'popular': 'Sequence-Based',
            'three_of_a_kind': 'Pattern-Based',
            'four_of_a_kind': 'Pattern-Based',
            'full_house': 'Pattern-Based',
            'jackpot': 'Pattern-Based',
            'short_straight': 'Pattern-Based',
            'no1boss': 'Pattern-Based',
        };

        fetch("https://cdn.oceansofnyc.com/web/oceans.json", { cache: "no-cache" })
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                // Derive contributor data from sightings
                // badges is a Map(badge_name → vin) so each checkmark can link to the earning vehicle
                const contributorMap = new Map();
                data.vehicles.forEach(vehicle => {
                    vehicle.sightings?.forEach(sighting => {
                        const name = sighting.contributor || 'Anonymous';
                        if (!contributorMap.has(name)) {
                            contributorMap.set(name, { name, sighting_count: 0, badges: new Map() });
                        }
                        const c = contributorMap.get(name);
                        c.sighting_count++;
                        sighting.badges?.forEach(b => c.badges.set(b.name, vehicle.vin));
                    });
                });

                // Sort by sighting count descending (matching server-side order)
                const contributors = Array.from(contributorMap.values())
                    .sort((a, b) => b.sighting_count - a.sighting_count);

                const badges = data.badge_definitions;

                // Render table header (contributors as columns)
                const thead = document.getElementById('tableHead');

                // First row: contributor names (rotated)
                let headerHTML = '<tr><th class="contributor-header"></th>';
                contributors.forEach(contributor => {
                    headerHTML += `
                        <th class="contributor-header">
                            <span class="contributor-name">${contributor.name}</span>
                        </th>
                    `;
                });
                headerHTML += '</tr>';

                // Second row: sighting counts
                headerHTML += '<tr class="sighting-count-row"><th>Sighting Count</th>';
                contributors.forEach(contributor => {
                    headerHTML += `<td>${contributor.sighting_count}</td>`;
                });
                headerHTML += '</tr>';

                thead.innerHTML = headerHTML;

                // Render table body (badges as rows)
                const tbody = document.getElementById('tableBody');
                let bodyHTML = '';
                let currentCategory = null;

                badges.forEach((badge, badgeIndex) => {
                    // Add category separator if category changed
                    const category = BADGE_CATEGORIES[badge.name] || 'Other';
                    if (category !== currentCategory) {
                        currentCategory = category;
                        bodyHTML += `
                            <tr class="category-row">
                                <td colspan="${contributors.length + 1}">${category}</td>
                            </tr>
                        `;
                    }

                    bodyHTML += '<tr>';

                    // Badge name column
                    bodyHTML += `
                        <td>
                            <div class="badge-cell">
                                <span class="badge-emoji">${badge.emoji || ''}</span>
                                <div class="badge-info">
                                    <span class="badge-name">${badge.display_name}</span>
                                    <span class="badge-description">${badge.description}</span>
                                </div>
                            </div>
                        </td>
                    `;

                    // Contributor columns
                    contributors.forEach(contributor => {
                        const vin = contributor.badges.get(badge.name);
                        bodyHTML += `
                            <td>
                                ${vin
                                    ? `<a href="/ocean/${vin}" class="has-badge">&#10003;</a>`
                                    : '<span class="no-badge">&mdash;</span>'
                                }
                            </td>
                        `;
                    });

                    bodyHTML += '</tr>';
                });

                tbody.innerHTML = bodyHTML;
            })
            .catch(error => {
                document.getElementById('loading').textContent = 'Error loading data: ' + error.message;
            });
    </script>
</body>
</html>
