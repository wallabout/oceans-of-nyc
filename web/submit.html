<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favico/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favico/favicon.svg" />
    <link rel="shortcut icon" href="/favico/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favico/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="OceansOfNYC" />
    <link rel="manifest" href="/favico/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Sighting - Oceans of NYC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #ffffff;
            padding-top: 60px;
        }

        /* Navigation */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }

        .nav-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .nav-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s, border-color 0.2s;
            border-bottom: 2px solid transparent;
        }

        .nav-link:hover {
            color: white;
        }

        .nav-link.active {
            color: white;
            border-bottom-color: white;
        }

        @media (max-width: 768px) {
            .nav {
                flex-wrap: wrap;
                height: auto;
                padding: 12px 16px;
            }

            .nav-brand {
                flex: 1;
            }

            .nav-title {
                font-size: 16px;
            }

            .nav-links {
                flex-basis: 100%;
                justify-content: flex-start;
                gap: 4px;
                margin-top: 12px;
                flex-wrap: wrap;
            }

            .nav-link {
                padding: 6px 12px;
                font-size: 13px;
            }

            body {
                padding-top: 110px;
            }
        }

        /* Submit page */
        .submit-page {
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            min-height: calc(100vh - 60px);
        }

        .submit-container {
            max-width: 500px;
            width: 100%;
        }

        .submit-container h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .submit-container > p {
            color: #666;
            margin-bottom: 32px;
        }

        /* Form styles */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: #333;
        }

        .form-input[type="file"] {
            padding: 8px;
        }

        .form-submit {
            width: 100%;
            padding: 12px;
            background: #333;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .form-submit:hover:not(:disabled) {
            background: #000;
        }

        .form-submit:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .form-hint {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .submit-status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }

        .submit-status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .submit-status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="index.html" class="nav-brand">
            <img src="oceans_of_nyc_logo.png" alt="Logo" class="nav-logo">
            <span class="nav-title">Oceans of NYC</span>
        </a>
        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="badges.html" class="nav-link">Bumper Stickers</a>
            <a href="submit.html" class="nav-link active">Submit</a>
            <a href="about.html" class="nav-link">About</a>
            <a href="stats.html" class="nav-link">Stats</a>
        </div>
    </nav>

    <main class="submit-page">
        <div class="submit-container">
            <h1>Submit a Sighting</h1>
            <p>Spotted a Fisker Ocean in NYC? Share your find with the community.</p>

            <form id="submitForm">
                <div class="form-group">
                    <label class="form-label" for="submitImage">Photo</label>
                    <input type="file" id="submitImage" name="image" accept="image/*" class="form-input" required>
                    <div class="form-hint">Upload a photo of the Fisker Ocean</div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="submitPlate">License Plate</label>
                    <input type="text" id="submitPlate" name="license_plate" placeholder="T123456C or 123456" class="form-input" required>
                    <div class="form-hint">Enter the TLC plate number (6 digits or full T######C format)</div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="submitBorough">Borough</label>
                    <select id="submitBorough" name="borough" class="form-select" required>
                        <option value="">Select borough...</option>
                        <option value="Manhattan">Manhattan</option>
                        <option value="Brooklyn">Brooklyn</option>
                        <option value="Queens">Queens</option>
                        <option value="Bronx">Bronx</option>
                        <option value="Staten Island">Staten Island</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="submitName">Your Name</label>
                    <input type="text" id="submitName" name="contributor_name" placeholder="Enter your name" class="form-input" required>
                    <div class="form-hint">How you'd like to be credited</div>
                </div>

                <button type="submit" class="form-submit" id="submitButton">Submit Sighting</button>
            </form>

            <div class="submit-status" id="submitStatus"></div>
        </div>
    </main>

    <script>
        document.getElementById('submitForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitButton = document.getElementById('submitButton');
            const submitStatus = document.getElementById('submitStatus');

            // Disable submit button
            submitButton.disabled = true;
            submitButton.textContent = 'Submitting...';

            // Clear previous status
            submitStatus.className = 'submit-status';
            submitStatus.textContent = '';

            try {
                // Prepare form data
                const formData = new FormData(e.target);

                // Send to Modal endpoint
                const response = await fetch('https://wallabout--oceans-of-nyc-web-submission-webhook.modal.run/submit', {
                    method: 'POST',
                    body: formData,
                });

                const result = await response.json();

                if (result.success) {
                    // Show success message
                    submitStatus.className = 'submit-status success';
                    submitStatus.textContent = result.message;

                    // Reset form
                    e.target.reset();

                    // Redirect to home after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    // Show error message
                    submitStatus.className = 'submit-status error';
                    submitStatus.textContent = result.message || 'An error occurred. Please try again.';
                }
            } catch (error) {
                console.error('Submission error:', error);
                submitStatus.className = 'submit-status error';
                submitStatus.textContent = 'Network error. Please check your connection and try again.';
            } finally {
                // Re-enable submit button
                submitButton.disabled = false;
                submitButton.textContent = 'Submit Sighting';
            }
        });
    </script>
</body>
</html>
